<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sistema de Gestão de Escala e Membros">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Escala IBAI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Escala IBAI</title>
  <link rel="manifest" href="manifest.json">

  <script>
    (function () {
      const FCM_SW_URL = '/firebase-messaging-sw.js';
      const FCM_SW_SCOPE = '/firebase-cloud-messaging-push-scope';

      function isIosDevice() {
        const ua = navigator.userAgent || '';
        const isAppleMobile = /iPhone|iPad|iPod/i.test(ua);
        const isIpadOs = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
        return isAppleMobile || isIpadOs;
      }

      function isStandaloneMode() {
        return (
          window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true
        );
      }

      async function ensureFirebaseSwReady() {
        if (!('serviceWorker' in navigator)) return false;
        try {
          let reg = await navigator.serviceWorker.getRegistration(FCM_SW_SCOPE);
          if (!reg) {
            reg = await navigator.serviceWorker.register(FCM_SW_URL, {
              scope: FCM_SW_SCOPE,
            });
          } else {
            // Verifica atualização silenciosa sem bloquear
            reg.update().catch(() => {});
          }

          if (reg.active) return true;

          const worker = reg.installing || reg.waiting;
          if (!worker) return !!reg.active;

          await new Promise((resolve) => {
            const timeout = setTimeout(resolve, 4000);
            worker.addEventListener('statechange', () => {
              if (worker.state === 'activated') {
                clearTimeout(timeout);
                resolve();
              }
            });
          });
          return true;
        } catch (err) {
          console.warn('Falha ao registrar firebase-messaging-sw.js:', err);
          return false;
        }
      }

      async function showForegroundNotification(title, body) {
        try {
          if (typeof Notification === 'undefined' || Notification.permission !== 'granted') {
            return false;
          }
          if ('serviceWorker' in navigator) {
            let reg = await navigator.serviceWorker.getRegistration(FCM_SW_SCOPE);
            if (!reg) {
              reg = await navigator.serviceWorker.getRegistration();
            }
            if (reg && typeof reg.showNotification === 'function') {
              await reg.showNotification(title || 'Escala IBAI', {
                body: body || '',
                icon: '/icons/Icon-192.png',
                badge: '/icons/Icon-192.png',
                data: { url: '/' },
              });
              return true;
            }
          }
          new Notification(title || 'Escala IBAI', {
            body: body || '',
            icon: '/icons/Icon-192.png',
          });
          return true;
        } catch (err) {
          console.warn('Erro ao exibir notificação em foreground:', err);
          return false;
        }
      }

      window._escalaPwaPush = {
        isIos: isIosDevice,
        isStandalone: isStandaloneMode,
        getPermission: function () {
          if (typeof Notification === 'undefined') return 'unsupported';
          return Notification.permission || 'default';
        },
        supportsPush: function () {
          return (
            typeof Notification !== 'undefined' &&
            'serviceWorker' in navigator &&
            'PushManager' in window
          );
        },
        ensureFirebaseSwReady: ensureFirebaseSwReady,
        showForegroundNotification: showForegroundNotification,
      };

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          ensureFirebaseSwReady();
        });
      }
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
